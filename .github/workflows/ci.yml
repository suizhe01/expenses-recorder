name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: expenses
          POSTGRES_DB: expenses
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenses -d expenses"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://expenses:expenses@localhost:5432/expenses
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions
      PUBLIC_BASE_URL: http://localhost:3000
      # Deliberately no RESEND_API_KEY: CI must never make network calls, so the
      # console transport is always selected.
      MAIL_FROM: ci@example.com
      # EXP-23 AC-4. Explicitly off, matching a directly-reachable API. The
      # config tests set it per-case rather than relying on this.
      TRUST_PROXY: 'false'
      # A scratch directory inside the runner workspace; the integration
      # suites override it per-test with a temporary directory anyway.
      RECEIPTS_PATH: ${{ github.workspace }}/ci-receipts
      # Deliberately no GEMINI_API_KEY, for the same reason as RESEND: CI must
      # never make network calls. Extraction is skipped, and every test that
      # exercises it injects a fake extractor.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/api

      - name: Typecheck
        run: npm run typecheck --workspace apps/api

      # Migrations run before the tests: the auth suite exercises real tables
      # rather than mocking the database.
      - name: Migrate
        run: npm run migrate --workspace apps/api

      # Running migrations twice must be a no-op.
      - name: Migrate again (idempotency)
        run: npm run migrate --workspace apps/api

      - name: Verify schema shape
        run: |
          psql "$DATABASE_URL" -c '\d users'
          psql "$DATABASE_URL" -c '\d sessions'
          psql "$DATABASE_URL" -tAc "
            SELECT string_agg(column_name, ',' ORDER BY column_name)
            FROM information_schema.columns
            WHERE table_name = 'users'
          " | grep -qx 'created_at,email,email_verified,google_sub,id,password_hash,updated_at'
          psql "$DATABASE_URL" -tAc "
            SELECT string_agg(column_name, ',' ORDER BY column_name)
            FROM information_schema.columns
            WHERE table_name = 'sessions'
          " | grep -qx 'created_at,expires_at,id,replaced_by,revoked_at,token_hash,user_id'
          psql "$DATABASE_URL" -tAc "
            SELECT string_agg(column_name, ',' ORDER BY column_name)
            FROM information_schema.columns
            WHERE table_name = 'email_verification_tokens'
          " | grep -qx 'consumed_at,created_at,expires_at,id,token_hash,user_id'
          # The gate cutoff must exist and hold exactly one row: it is what
          # keeps the backfill from re-running over pending accounts.
          psql "$DATABASE_URL" -tAc "SELECT count(*) FROM email_verification_gate" | grep -qx '1'

      - name: Test
        run: npm run test --workspace apps/api

      # EXP-24 AC-16. The mobile workspace joins the same required check, so
      # one green `ci` still covers the repository.
      #
      # These need no database and no device: the session logic takes its
      # transport and storage as dependencies, so nothing here touches the
      # network or a native module.
      - name: Lint (mobile)
        run: npm run lint --workspace apps/mobile

      - name: Typecheck (mobile)
        run: npm run typecheck --workspace apps/mobile

      - name: Test (mobile)
        run: npm run test --workspace apps/mobile

      - name: Migrate down
        run: npm run migrate:down --workspace apps/api

      # EXP-23 AC-9. The production image is only exercised at deploy time,
      # which is the worst moment to discover the multi-stage build or
      # `npm run build` has rotted. This builds it on every PR.
      #
      # amd64 only — the runner's architecture. The deploy target is arm64,
      # and cross-building it here would need qemu and minutes of emulation for
      # a check whose job is to catch broken Dockerfile and TypeScript build
      # steps, neither of which is architecture-specific.
      - name: Build production image
        run: docker build -f apps/api/Dockerfile.prod -t expenses-api:ci .

      # The image is worth nothing if it cannot start. `node dist/index.js`
      # exits non-zero on a config error, so a missing variable, a broken
      # import path or an unresolvable dist entry point all surface here
      # rather than on the VPS.
      - name: Production image starts and validates its config
        run: |
          # No DATABASE_URL: the process must refuse to start AND name the
          # variable. Proves the entry point runs at all.
          output=$(docker run --rm -e JWT_SECRET=ci-only-secret-not-used-outside-github-actions \
            -e PUBLIC_BASE_URL=http://localhost:3000 \
            expenses-api:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'DATABASE_URL'

      # AC-2. The migration CLI must be present in the production image, or the
      # runbook's explicit migrate step is impossible.
      #
      # --network none is load-bearing. `npx node-pg-migrate` was the obvious
      # check and it is worthless: when the package is absent npx silently
      # DOWNLOADS it and reports success, which is exactly what happened while
      # the lockfile still had node-pg-migrate marked dev and `npm ci
      # --omit=dev` was skipping it. Resolving it with no network available
      # fails when it is genuinely missing.
      - name: Production image carries the migration CLI
        run: |
          docker run --rm --network none expenses-api:ci \
            node -e "console.log(require.resolve('node-pg-migrate'))"
