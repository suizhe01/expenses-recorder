# EXP-23 AC-3. Production stack. Used with an explicit -f:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# It is NOT an override layered on docker-compose.yml — a forgotten -f would
# otherwise silently give the development image with its bind mounts. See
# docs/deploy.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    # Deliberately no `ports`. Nothing outside the compose network reaches the
    # database; the API talks to it on the service name. Publishing 5433 as the
    # development file does would put Postgres on the VPS's public interface.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-expenses} -d ${POSTGRES_DB:-expenses}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — generate a fresh one, do not reuse the development placeholder}
      # Must be the Funnel hostname, not localhost: verification links are
      # built from this and opened on a phone. See docs/deploy.md.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set to the https://<host>.ts.net Funnel hostname}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      RECEIPTS_PATH: /data/receipts
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Internal-only OCR service. It has no host port and is reached only on
      # Compose's private network by this API container.
      PADDLEOCR_BASE_URL: http://paddleocr:8008
      PADDLEOCR_ENABLED: ${PADDLEOCR_ENABLED:-true}
      PADDLEOCR_TIMEOUT_MS: ${PADDLEOCR_TIMEOUT_MS:-5000}
      TZ: UTC
      # AC-4, AC-5. On here, unlike development: the Funnel is a reverse proxy,
      # so without this every request looks like it came from the same address
      # and the auth rate limiter becomes one bucket shared by all clients.
      # Safe only because of the loopback binding below.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-expenses}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expenses}
    ports:
      # AC-3. Loopback ONLY. `tailscaled` runs on the host and proxies to this;
      # nothing else can reach the API, which is what makes the forwarded
      # header above trustworthy. Writing '3000:3000' here would publish the
      # API on the VPS's public interface and make X-Forwarded-For forgeable
      # by anyone — the whole security argument depends on this line.
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      paddleocr:
        condition: service_started
    volumes:
      # The receipts archive. No source bind mounts — the code is in the image.
      - receipts-data:/data/receipts

  paddleocr:
    platform: linux/amd64
    build:
      context: ./services/paddleocr
    restart: unless-stopped
    # No ports: this service is deliberately inaccessible from the host, LAN,
    # and public internet. The API uses http://paddleocr:8008 internally.
    volumes:
      - paddleocr-models:/root/.paddlex

volumes:
  postgres-data:
  receipts-data:
  paddleocr-models:
