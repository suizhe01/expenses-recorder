services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenses}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-expenses} -d ${POSTGRES_DB:-expenses}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — copy .env.example to .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      # Inside the container this is the mount point of the receipts volume,
      # not the host path — the archive must not live in the bind-mounted
      # source tree.
      RECEIPTS_PATH: /data/receipts
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      # EXP-17 AC-5. The container already ran UTC, but only as Docker's default
      # — nothing said so, and nothing stopped a future deploy from setting local
      # time. Date-only columns are converted in SQL now, so this is no longer
      # load-bearing for correctness; it is here so the process timezone is a
      # deliberate choice rather than an accident nobody would think to check.
      #
      # Deliberately NOT part of the zod config schema: this is a runtime
      # property of the container, not application configuration.
      TZ: UTC
      # EXP-23 AC-4. Off in development: nothing proxies this stack, so a
      # forwarded header would be pure client input. The production file turns
      # it on, where a reverse proxy really is in front.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Inside the compose network Postgres is reachable on its service name
      # and container port, regardless of the host port mapping above.
      DATABASE_URL: postgres://${POSTGRES_USER:-expenses}:${POSTGRES_PASSWORD:-expenses}@postgres:5432/${POSTGRES_DB:-expenses}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/migrations:/app/apps/api/migrations:ro
      # EXP-13 AC-15: the first writable volume. Receipt images survive
      # `docker compose down` and a rebuild, unlike anything in the image.
      # Note this means postgres-data alone is no longer a complete backup.
      - receipts-data:/data/receipts

  # EXP-52: a local-only observation service. It deliberately has no production
  # compose entry and is not wired into the API request path.
  paddleocr:
    profiles: ['ocr']
    # PaddlePaddle's Linux arm64 CPU wheel currently segfaults on real receipt
    # inference under Docker Desktop. Use the stable x86_64 wheel; Docker
    # Desktop emulates it on Apple Silicon and Windows WSL normally runs it
    # natively.
    platform: linux/amd64
    build:
      context: ./services/paddleocr
    ports:
      # Keep the observation service on this machine; it is never a LAN or
      # production endpoint.
      - '127.0.0.1:${PADDLEOCR_PORT:-8008}:8008'
    volumes:
      # PaddleOCR downloads its official models on first use. Keeping its cache
      # in a named volume makes subsequent starts offline and fast.
      - paddleocr-models:/root/.paddlex

volumes:
  postgres-data:
  receipts-data:
  paddleocr-models:
